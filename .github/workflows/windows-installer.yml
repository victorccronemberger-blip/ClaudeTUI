name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - run: uv sync --locked --group windows-build
      - run: uv run --no-sync pytest tests/cli/test_windows_application.py tests/cli/test_doctor.py -n 0 -q
      - run: uv run --no-sync python scripts/build_windows.py
      - run: .\dist\windows\ClaudeTUI\ClaudeTUI-Terminal.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeTUI-Windows-x64
          path: dist/ClaudeTUI-Setup-*-x64.exe
          if-no-files-found: error
